name: Build and Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: "win64_msvc2022_64"
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        shell: pwsh
        run: cmake --build build --parallel

      - name: Package
        shell: pwsh
        run: |
          if (!(Test-Path "build/bin/PowerMacEmulator.exe")) {
            throw "PowerMacEmulator.exe was not built"
          }
          if (!(Test-Path "build/bin/PowerMacVMManager.exe")) {
            throw "PowerMacVMManager.exe was not built"
          }

          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -Path "build/bin/*" -Destination dist -Recurse -Force
          Copy-Item -Path @("README.md", "LICENSE") -Destination dist -Force
          Compress-Archive -Path "dist/*" `
            -DestinationPath "PowerMacEmulator-Windows-x64.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PowerMacEmulator-Windows-x64
          path: PowerMacEmulator-Windows-x64.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PowerMacEmulator-Windows-x64.zip
          generate_release_notes: true
